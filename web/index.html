<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikari Studio</title>
  <link rel="stylesheet" href="/static/css/studio.css">
</head>
<body>
  <div id="app">
    <!-- Full-bleed interactive stage: procedural/custom room canvas + WebGL2 Hikari canvas -->
    <div id="stage-wrap">
      <canvas id="room-canvas"></canvas>
      <img id="custom-room-img" alt="" hidden>
      <canvas id="avatar-canvas"></canvas>
      <div id="stage-vignette"></div>
      <div id="stage-fx" aria-hidden="true"></div>
    </div>

    <!-- Minimal corner chrome -->
    <header id="hud-top">
      <div class="brand-block">
        <span class="brand-name">Hikari<span class="dot">.</span></span>
        <span class="sep">/</span>
        <span id="hud-room-name">Twilight Atelier</span>
      </div>
      <div class="status-pill" id="hud-conn" data-state="connecting" title="Studio connection">
        <i></i><span id="hud-conn-label">Connecting…</span>
        <span class="pill-sep"></span><span class="metric" id="hud-fps">-- FPS</span>
        <span class="pill-sep"></span><span class="metric" id="hud-viseme">Viseme: X</span>
      </div>
    </header>

    <!-- Quick-emote popover (filled by app.js) -->
    <div id="emote-popover" role="dialog" aria-label="Quick emotes" hidden>
      <div class="pop-head"><span>Quick emotes</span><kbd>1–9</kbd></div>
      <div id="emote-popover-grid"></div>
      <div class="pop-foot">
        <button type="button" class="pop-link" id="btn-quick-wave">Wave hello</button>
        <button type="button" class="pop-link" id="btn-pop-motion">All motion settings →</button>
      </div>
    </div>

    <!-- Subtitles + compact bottom pill bar -->
    <section id="chat-dock">
      <div id="subtitle-bar" hidden>
        <span id="subtitle-tag" class="sub-tag">happy</span>
        <span id="subtitle-text"></span>
      </div>
      <form id="chat-form" autocomplete="off">
        <button type="button" class="bar-btn" id="btn-mic" title="Push-to-talk (Fish ASR) · mute/unmute during a call" aria-label="Microphone">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
        </button>
        <input id="chat-input" type="text" placeholder="Talk to Hikari…" aria-label="Message Hikari">
        <button type="button" class="bar-btn danger" id="btn-interrupt" title="Interrupt / stop audio" aria-label="Interrupt" hidden>
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button type="submit" class="bar-btn send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <span class="bar-sep" aria-hidden="true"></span>
        <button type="button" class="bar-btn call" id="btn-fish-call" title="Connect Drama 3 voice call" aria-label="Voice call">
          <svg viewBox="0 0 24 24"><path d="M5 4h3.5l1.8 4.4-2.3 1.4a11 11 0 0 0 6.2 6.2l1.4-2.3L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4Z"/></svg>
        </button>
        <button type="button" class="bar-btn" id="btn-emotes" title="Quick emotes (E)" aria-label="Quick emotes" aria-expanded="false" aria-controls="emote-popover">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8Z"/></svg>
        </button>
        <button type="button" class="bar-btn" id="btn-settings" title="Settings (Ctrl+,)" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </form>
    </section>

    <!-- Codex-style Settings panel, docked left (no scrim — the stage stays live and interactive) -->
    <div id="settings" class="modal-root" hidden>
      <div class="modal" role="dialog" aria-modal="false" aria-labelledby="inspector-title" tabindex="-1">
        <aside class="modal-side">
          <button type="button" class="side-back" data-close>
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to stage
          </button>
          <div class="side-search" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input id="settings-search" type="text" placeholder="Search settings" aria-label="Search settings"
              autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false"
              aria-controls="settings-search-results" aria-autocomplete="list">
            <kbd class="search-kbd" aria-hidden="true">/</kbd>
            <button type="button" class="search-clear" id="settings-search-clear" aria-label="Clear search" hidden>×</button>
            <div class="search-results" id="settings-search-results" role="listbox" aria-label="Matching settings" hidden></div>
          </div>
          <nav class="side-nav" aria-label="Settings sections">
            <button class="nav-item" data-tab="general">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>General &amp; Stage</span>
            </button>
            <button class="nav-item" data-tab="look">
              <svg viewBox="0 0 24 24"><path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/></svg><span>Look &amp; Props</span>
            </button>
            <button class="nav-item" data-tab="motion">
              <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg><span>Motion &amp; Emotions</span>
            </button>
            <button class="nav-item" data-tab="voice">
              <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg><span>Voice &amp; Brain</span>
            </button>
            <button class="nav-item" data-tab="memory">
              <svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1Z"/><path d="M9 8.5h6M9 12h4" opacity=".7"/></svg><span>Memory &amp; Context</span>
            </button>
            <button class="nav-item" data-tab="lipsync">
              <svg viewBox="0 0 24 24"><path d="M3 12c2.6-3.6 5.8-5.2 9-5.2s6.4 1.6 9 5.2c-2.6 3.6-5.8 5.2-9 5.2S5.6 15.6 3 12Z"/><path d="M7.5 12h9"/></svg><span>Lip-Sync</span>
            </button>
            <button class="nav-item" data-tab="advanced">
              <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Advanced</span>
            </button>
          </nav>
          <div class="side-foot">
            <button type="button" class="btn primary block" id="btn-save-settings" title="Write all settings to disk">Save settings</button>
            <span class="side-hint">Changes apply live</span>
          </div>
        </aside>
        <section class="modal-main">
          <header class="main-head">
            <div>
              <h1 id="inspector-title">General &amp; Stage</h1>
              <p id="inspector-sub"></p>
            </div>
            <button type="button" class="close-x" data-close title="Close (Esc)" aria-label="Close settings">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </header>
          <div id="inspector-body"></div>
        </section>
      </div>
    </div>
  </div>

  <audio id="voice-audio" preload="auto"></audio>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
