[package]
name = "hikari-desktop"
version = "1.0.0"
description = "Hikari Studio native desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "tray-icon", "image-png", "custom-protocol"] }
tokio = { version = "1", default-features = false, features = ["process", "net", "time", "io-util", "fs", "rt", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
